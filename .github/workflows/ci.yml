name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Test without iCloud credentials
        run: npm test
        env:
          IMAP_USER: ''
          IMAP_PASSWORD: ''
          ICLOUD_MCP_SEND: ''
          ICLOUD_MCP_LIVE: ''
